name: Zrób short z klipu

# Nazwa przebiegu zawiera numer zadania, po którym strona rozpoznaje swój przebieg
run-name: Short ${{ inputs.job || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      clip:
        description: "Link do klipu (Kick albo Twitch)"
        required: true
      caption:
        description: "Napis w czerwonym pasku (np. POŻAR W CHACIE)"
        required: false
        default: ""
      cam:
        description: "Gdzie jest kamerka: x,y,w,h jako ułamki 0-1"
        required: false
        default: "0,0,0.26,0.33"
      game:
        description: "Wycinek gry x,y,w,h (puste = środek klatki)"
        required: false
        default: ""
      opts:
        description: "Opcje po przecinku: nologo,nocam,cut,captions"
        required: false
        default: ""
      nums:
        description: "Liczby po przecinku: głośność,start,koniec,maks.długość,góra pasa,wysokość pasa"
        required: false
        default: "1,0,0,0,380,1080"
      job:
        description: "Numer zadania (wypełnia strona, ręcznie zostaw puste)"
        required: false
        default: ""

permissions:
  contents: write   # potrzebne do wystawienia gotowego filmu jako release

jobs:
  short:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalacja ffmpeg i Pillow
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install pillow
          case ",${{ inputs.opts }}," in *,captions,*) pip install faster-whisper ;; esac

      - name: Pamięć podręczna modelu Whisper
        if: ${{ contains(inputs.opts, 'captions') }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Montaż
        env:
          KICK_PROXY: https://kick-proxy.xdodo-jnb.workers.dev
          CLIP: ${{ inputs.clip }}
          CAPTION: ${{ inputs.caption }}
          CAM: ${{ inputs.cam }}
          GAME: ${{ inputs.game }}
          OPTS: ${{ inputs.opts }}
          NUMS: ${{ inputs.nums }}
        run: |
          EXTRA=""
          case ",$OPTS," in *,nologo,*)   EXTRA="$EXTRA --no-logo" ;; esac
          case ",$OPTS," in *,nocam,*)    EXTRA="$EXTRA --no-cam" ;; esac
          case ",$OPTS," in *,cut,*)      EXTRA="$EXTRA --cut-silence" ;; esac
          case ",$OPTS," in *,captions,*) EXTRA="$EXTRA --captions" ;; esac
          IFS=, read -r VOLUME START END MAXLEN BANDY BANDH <<< "${NUMS:-1,0,0,0,380,1080}"
          python3 shorts/short.py --clip "$CLIP" --caption "$CAPTION" \
            --cam "$CAM" --game "$GAME" $EXTRA \
            --volume "${VOLUME:-1}" --start "${START:-0}" --end "${END:-0}" \
            --max-seconds "${MAXLEN:-0}" --band "${BANDY:-380},${BANDH:-1080}" --out short.mp4

      - name: Wynik do pobrania (zakładka Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: short
          path: short.mp4

      - name: Wystaw film do pobrania ze strony
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: ${{ inputs.job }}
        run: |
          TAG="short-${JOB:-$GITHUB_RUN_ID}"
          gh release create "$TAG" short.mp4 --title "Short ${JOB:-$GITHUB_RUN_ID}" \
            --notes "Wygenerowany automatycznie." --latest=false
