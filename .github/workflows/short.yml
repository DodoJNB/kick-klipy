name: Zrób short z klipu

# Nazwa przebiegu zawiera numer zadania, po którym strona rozpoznaje swój przebieg
run-name: Short ${{ inputs.job || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      clip:
        description: "Link do klipu na Kicku (https://kick.com/kanal/clips/clip_...)"
        required: true
      caption:
        description: "Napis w czerwonym pasku (np. POŻAR W CHACIE)"
        required: false
        default: ""
      cam:
        description: "Gdzie jest kamerka w klipie: x,y,w,h jako ułamki 0-1"
        required: false
        default: "0,0,0.26,0.33"
      game:
        description: "Wycinek gry x,y,w,h (puste = środek klatki)"
        required: false
        default: ""
      nologo:
        description: "1 = bez logo TSXNINE"
        required: false
        default: ""
      nocam:
        description: "1 = bez kamerki (gra na cały ekran)"
        required: false
        default: ""
      cut:
        description: "1 = wytnij ciszę (fragmenty, gdzie nikt nic nie mówi)"
        required: false
        default: ""
      job:
        description: "Numer zadania (wypełnia strona, ręcznie zostaw puste)"
        required: false
        default: ""

permissions:
  contents: write   # potrzebne do wystawienia gotowego filmu jako release

jobs:
  short:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalacja ffmpeg i Pillow
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install pillow

      - name: Montaż
        env:
          KICK_PROXY: https://kick-proxy.xdodo-jnb.workers.dev
          CLIP: ${{ inputs.clip }}
          CAPTION: ${{ inputs.caption }}
          CAM: ${{ inputs.cam }}
          GAME: ${{ inputs.game }}
          NOLOGO: ${{ inputs.nologo }}
          CUT: ${{ inputs.cut }}
          NOCAM: ${{ inputs.nocam }}
        run: |
          EXTRA=""
          [ "$NOLOGO" = "1" ] && EXTRA="$EXTRA --no-logo"
          [ "$NOCAM" = "1" ] && EXTRA="$EXTRA --no-cam"
          [ "$CUT" = "1" ] && EXTRA="$EXTRA --cut-silence"
          python3 shorts/short.py --clip "$CLIP" --caption "$CAPTION" \
            --cam "$CAM" --game "$GAME" $EXTRA --out short.mp4

      - name: Wynik do pobrania (zakładka Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: short
          path: short.mp4

      - name: Wystaw film do pobrania ze strony
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: ${{ inputs.job }}
        run: |
          TAG="short-${JOB:-$GITHUB_RUN_ID}"
          gh release create "$TAG" short.mp4 --title "Short ${JOB:-$GITHUB_RUN_ID}" \
            --notes "Wygenerowany automatycznie." --latest=false
