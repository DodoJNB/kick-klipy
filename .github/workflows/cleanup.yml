name: Sprzątanie starych filmów

# Usuwa wydania z shortami i propozycjami starsze niż 14 dni, żeby repozytorium nie rosło.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Usuń wydania starsze niż tyle dni"
        required: false
        default: "14"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Usuń stare wydania
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS: ${{ inputs.days || '14' }}
        run: |
          CUTOFF=$(date -u -d "-${DAYS} days" +%Y-%m-%dT%H:%M:%SZ)
          echo "Usuwam wydania short-* i suggest-* sprzed $CUTOFF"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 500 --json tagName,createdAt \
            --jq ".[] | select((.tagName | startswith(\"short-\") or startswith(\"suggest-\")) and .createdAt < \"$CUTOFF\") | .tagName" |
          while read -r TAG; do
            echo "usuwam $TAG"
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
