name: Propozycje napisów z klipu

# Nazwa przebiegu zawiera numer zadania, po którym strona rozpoznaje swój przebieg
run-name: Suggest ${{ inputs.job || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      clip:
        description: "Link do klipu (Kick albo Twitch)"
        required: true
      job:
        description: "Numer zadania (wypełnia strona)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  suggest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalacja
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install pillow faster-whisper

      - name: Pamięć podręczna modelu Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Rozpoznanie mowy
        env:
          KICK_PROXY: https://kick-proxy.xdodo-jnb.workers.dev
          CLIP: ${{ inputs.clip }}
        run: python3 shorts/short.py --clip "$CLIP" --suggest suggest.json

      - name: Wystaw wynik
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: ${{ inputs.job }}
        run: |
          TAG="suggest-${JOB:-$GITHUB_RUN_ID}"
          gh release create "$TAG" suggest.json --title "Propozycje ${JOB:-$GITHUB_RUN_ID}" \
            --notes "Wygenerowane automatycznie." --latest=false
