<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Powiadomienia o streamach</title>
<style>
  :root { --bg:#0b0e0f; --card:#14181a; --line:#232a2d; --text:#eef2f3; --muted:#8b979b; --kick:#53fc18; --twitch:#9146ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  .row { display:flex; gap:10px; margin-bottom:10px; }
  input, button { font:inherit; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  input { flex:1; min-width:0; }
  button { cursor:pointer; }
  button.primary { background:var(--kick); color:#0b0e0f; border-color:var(--kick); font-weight:700; }
  button:disabled { opacity:.5; cursor:default; }
  h2 { font-size:16px; margin:26px 0 10px; }
  ul { list-style:none; margin:0; padding:0; }
  li { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; }
  .dot { width:10px; height:10px; border-radius:50%; flex:none; }
  .dot.kick { background:var(--kick); } .dot.twitch { background:var(--twitch); }
  li a { color:inherit; text-decoration:none; flex:1; overflow:hidden; text-overflow:ellipsis; }
  li small { color:var(--muted); }
  li button { padding:6px 10px; color:#ff6b6b; }
  .msg { min-height:22px; margin-top:10px; font-size:14px; color:var(--muted); }
  .msg.err { color:#ff6b6b; } .msg.ok { color:var(--kick); }
  pre { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px; white-space:pre-wrap; font-size:13px; color:var(--muted); }
  .empty { color:var(--muted); padding:10px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Powiadomienia o streamach</h1>
  <p class="sub">Wklej link do kanału z Kicka albo Twitcha. Gdy ta osoba wejdzie na żywo, na Discordzie pojawi się powiadomienie.</p>

  <div class="row">
    <input id="pass" type="password" placeholder="Hasło do panelu" autocomplete="current-password">
    <button id="login">Zaloguj</button>
  </div>
  <div class="msg" id="msg"></div>

  <div id="panel" hidden>
    <h2>Dodaj streamera</h2>
    <form class="row" id="add">
      <input id="link" placeholder="https://kick.com/mamm0n albo https://twitch.tv/..." autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="primary" type="submit">Dodaj</button>
    </form>

    <h2>Obserwowani</h2>
    <ul id="list"></ul>

    <h2>Narzędzia</h2>
    <div class="row">
      <button id="test">Wyślij testowe powiadomienie</button>
      <button id="check">Sprawdź teraz</button>
    </div>
    <pre id="log" hidden></pre>
  </div>
</div>

<script>
const API = "https://stream-notifier.xdodo-jnb.workers.dev";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

let key = "";
try { key = sessionStorage.getItem("sn_key") || ""; } catch {}
$("pass").value = key;

function say(text, cls = "") { $("msg").className = "msg " + cls; $("msg").textContent = text; }

async function call(path, method = "GET", body) {
  const res = await fetch(API + path, {
    method,
    headers: { "X-Admin-Key": key, ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Błąd " + res.status);
  return data;
}

function render(streamers) {
  $("list").innerHTML = streamers.length
    ? streamers.map((id) => {
        const [platform, name] = id.split(":");
        const href = platform === "kick" ? `https://kick.com/${name}` : `https://twitch.tv/${name}`;
        return `<li><span class="dot ${platform}"></span>
          <a href="${esc(href)}" target="_blank" rel="noopener">${esc(name)} <small>${platform === "kick" ? "Kick" : "Twitch"}</small></a>
          <button data-id="${esc(id)}">Usuń</button></li>`;
      }).join("")
    : '<div class="empty">Lista jest pusta.</div>';
}

async function login() {
  key = $("pass").value;
  try {
    const data = await call("/api/streamers");
    try { sessionStorage.setItem("sn_key", key); } catch {}
    $("panel").hidden = false;
    render(data.streamers);
    say("Zalogowano.", "ok");
  } catch (e) {
    $("panel").hidden = true;
    say(e.message, "err");
  }
}

$("login").addEventListener("click", login);
$("pass").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });

$("add").addEventListener("submit", async (e) => {
  e.preventDefault();
  const link = $("link").value.trim();
  if (!link) return;
  try {
    render((await call("/api/streamers", "POST", { link })).streamers);
    $("link").value = "";
    say("Dodano.", "ok");
  } catch (err) { say(err.message, "err"); }
});

$("list").addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-id]");
  if (!b) return;
  try {
    render((await call("/api/streamers?id=" + encodeURIComponent(b.dataset.id), "DELETE")).streamers);
    say("Usunięto.", "ok");
  } catch (err) { say(err.message, "err"); }
});

$("test").addEventListener("click", async () => {
  try { await call("/api/test", "POST"); say("Wysłano test na Discorda.", "ok"); }
  catch (err) { say(err.message, "err"); }
});

$("check").addEventListener("click", async () => {
  $("check").disabled = true;
  try {
    const { log } = await call("/api/check", "POST");
    $("log").hidden = false;
    $("log").textContent = log.join("\n") || "Brak wyników.";
    say("Gotowe.", "ok");
  } catch (err) { say(err.message, "err"); }
  $("check").disabled = false;
});

if (key) login();
</script>
</body>
</html>
