<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klipy z Kicka</title>
<style>
  :root {
    --bg: #0b0e0f;
    --card: #14181a;
    --line: #232a2d;
    --text: #eef2f3;
    --muted: #8b979b;
    --accent: #53fc18;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  form {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding-bottom: 16px; border-bottom: 1px solid var(--line); margin-bottom: 20px;
  }
  input, select, button {
    font: inherit; color: var(--text); background: var(--card);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  }
  input { flex: 1 1 180px; min-width: 0; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: #0b0e0f; border-color: var(--accent); font-weight: 700; }
  button:disabled { opacity: .5; cursor: default; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: var(--card); color: var(--muted); }
  .seg button.on { background: var(--accent); color: #0b0e0f; font-weight: 700; }
  .grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  a.clip { color: inherit; text-decoration: none; display: block; }
  .thumb {
    position: relative; aspect-ratio: 16 / 9; background: var(--card);
    border-radius: 10px; overflow: hidden;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge {
    position: absolute; padding: 2px 7px; border-radius: 6px; font-size: 13px; font-weight: 600;
    background: rgba(0,0,0,.72);
  }
  .dur { top: 8px; left: 8px; }
  .views { bottom: 8px; left: 8px; }
  .clip:hover .thumb { outline: 2px solid var(--accent); }
  .title { margin: 10px 0 2px; font-weight: 600; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .meta { color: var(--muted); font-size: 14px; }
  .msg { color: var(--muted); padding: 30px 0; text-align: center; }
  .msg.err { color: #ff6b6b; }
  .more { display: block; margin: 28px auto 0; }
  .more[hidden] { display: none; }
  .item { position: relative; }
  .rank { top: 8px; right: 8px; background: var(--accent); color: #0b0e0f; }
  a.cut { display: inline-block; margin-top: 8px; padding: 6px 12px; border-radius: 8px; background: var(--card);
          border: 1px solid var(--line); color: var(--text); text-decoration: none; font-size: 14px; font-weight: 600; }
  a.cut:hover { border-color: var(--accent); color: var(--accent); }
  .nav { float: right; font-size: 14px; }
  .nav a { color: var(--muted); text-decoration: none; margin-left: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Klipy z Kicka <span class="nav"><a href="shorty.html">✂ Shorty</a><a href="powiadomienia.html">🔔 Powiadomienia</a></span></h1>

  <form id="form">
    <input id="channel" placeholder="Nazwa kanału, np. mamm0n" autocomplete="off" autocapitalize="off" spellcheck="false" required>
    <div class="seg" id="sort">
      <button type="button" data-v="date" class="on">Najnowsze</button>
      <button type="button" data-v="view">Najpopularniejsze</button>
    </div>
    <button type="button" id="rank" title="Najpopularniejsze klipy z ostatnich 7 dni">🏆 Ranking tygodnia</button>
    <select id="time" title="Zakres czasu">
      <option value="all">Cały czas</option>
      <option value="month">Miesiąc</option>
      <option value="week">Tydzień</option>
      <option value="day">Dzień</option>
    </select>
    <button class="primary" type="submit">Pokaż</button>
  </form>

  <div id="out"></div>
  <button class="more" id="more" hidden>Załaduj więcej</button>
</div>

<script>
const PROXY = "https://kick-proxy.xdodo-jnb.workers.dev";
const $ = (id) => document.getElementById(id);
const out = $("out"), moreBtn = $("more");
let sort = "date", cursor = null, busy = false;

// Domyślny kanał: ?channel=nazwa w adresie albo ostatnio użyty
const qs = new URLSearchParams(location.search);
$("channel").value = qs.get("channel") || localStorage.getItem("kc_channel") || "mamm0n";
if (qs.get("sort") === "view") setSort("view");

function setSort(v) {
  sort = v;
  document.querySelectorAll("#sort button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
}
$("sort").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  setSort(b.dataset.v);
  load(true);
});
$("time").addEventListener("change", () => load(true));
$("rank").addEventListener("click", () => { setSort("view"); $("time").value = "week"; load(true); });
$("form").addEventListener("submit", (e) => { e.preventDefault(); load(true); });
moreBtn.addEventListener("click", () => load(false));

const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function fmtDur(s) {
  s = Math.round(s);
  return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}
function ago(iso) {
  if (!iso) return "";
  const m = Math.max(0, (Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 60) return Math.max(1, Math.round(m)) + " min temu";
  const h = m / 60;
  if (h < 24) return Math.round(h) + " godz. temu";
  const d = h / 24;
  if (d < 30) return Math.round(d) + " dn. temu";
  if (d < 365) return Math.round(d / 30) + " mies. temu";
  return Math.round(d / 365) + " lat temu";
}
function fmtViews(n) {
  return n >= 1000 ? (n / 1000).toFixed(1).replace(".", ",") + " tys." : String(n);
}

function card(c, i) {
  const meta = [c.category, ago(c.createdAt)].filter(Boolean).map(esc).join(" • ");
  const rank = sort === "view" && $("time").value === "week" ? `<span class="badge rank">#${c.rank}</span>` : "";
  return `<div class="item"><a class="clip" href="${esc(c.url)}" target="_blank" rel="noopener">
    <div class="thumb">
      ${rank}
      ${c.thumbnail ? `<img src="${esc(c.thumbnail)}" alt="" loading="lazy">` : ""}
      <span class="badge dur">${fmtDur(c.duration)}</span>
      <span class="badge views">${fmtViews(c.views)} wyświetleń</span>
    </div>
    <div class="title">${esc(c.title)}</div>
    <div class="meta">${meta}</div>
  </a>
  <a class="cut" href="shorty.html?clip=${encodeURIComponent(c.url)}">✂ Zrób short</a></div>`;
}

async function load(reset) {
  if (busy) return;
  const channel = $("channel").value.trim();
  if (!channel) return;
  busy = true;
  moreBtn.hidden = true;
  if (reset) {
    cursor = null;
    out.innerHTML = '<div class="msg">Ładowanie…</div>';
    localStorage.setItem("kc_channel", channel);
    const u = new URL(location.href);
    u.searchParams.set("channel", channel);
    u.searchParams.set("sort", sort);
    history.replaceState(null, "", u);
  }
  try {
    const p = new URLSearchParams({ sort, time: $("time").value });
    if (cursor) p.set("cursor", cursor);
    const kickUrl = `https://kick.com/api/v2/channels/${encodeURIComponent(channel.toLowerCase())}/clips?${p}`;
    const res = await fetch(`${PROXY}?url=${encodeURIComponent(kickUrl)}`);
    if (res.status === 404) throw new Error("Nie znaleziono kanału.");
    if (!res.ok) throw new Error("Kick zwrócił błąd " + res.status + ".");
    const raw = await res.json();
    const data = {
      nextCursor: raw.nextCursor || null,
      clips: (raw.clips || raw.data || []).map((c) => ({
        title: c.title || "(bez tytułu)",
        thumbnail: c.thumbnail_url || null,
        duration: c.duration || 0,
        views: c.view_count ?? c.views ?? 0,
        createdAt: c.created_at || null,
        category: (c.category && c.category.name) || "",
        url: `https://kick.com/${(c.channel && c.channel.slug) || channel.toLowerCase()}/clips/${c.id}`,
      })),
    };

    if (reset) out.innerHTML = '<div class="grid" id="grid"></div>';
    if (!data.clips.length && reset) {
      out.innerHTML = '<div class="msg">Brak klipów.</div>';
    } else {
      const base = $("grid").children.length;
      data.clips.forEach((c, i) => { c.rank = base + i + 1; });
      $("grid").insertAdjacentHTML("beforeend", data.clips.map(card).join(""));
    }
    cursor = data.nextCursor;
    moreBtn.hidden = !cursor;
  } catch (err) {
    if (reset) out.innerHTML = `<div class="msg err">${esc(err.message)}</div>`;
    else alert(err.message);
  } finally {
    busy = false;
  }
}

load(true);
</script>
</body>
</html>
